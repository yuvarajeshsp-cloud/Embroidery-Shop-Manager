<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Choose a printer</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1b1d2a; --muted:#6b6f85; --line:#e3e4ee; --accent:#6c6cf0; --hover:#f1f1fb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1d1f2b; --fg:#ecedf6; --muted:#9a9db5; --line:#2e3040; --accent:#8d8df7; --hover:#292b3a; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px -apple-system, "Segoe UI", system-ui, sans-serif; background:var(--bg); color:var(--fg); display:flex; flex-direction:column; height:100vh; }
  header { padding:16px 18px 10px; }
  h1 { font-size:16px; margin:0 0 4px; }
  p { margin:0; color:var(--muted); font-size:12.5px; line-height:1.4; }
  ul { list-style:none; margin:0; padding:6px 10px; overflow:auto; flex:1; }
  li button { width:100%; text-align:left; padding:11px 12px; border:0; background:none; color:inherit; font:inherit; border-radius:8px; cursor:pointer; }
  li button:hover, li button:focus-visible { background:var(--hover); outline:2px solid var(--accent); outline-offset:-2px; }
  li small { display:block; color:var(--muted); font-size:12px; margin-top:2px; }
  .empty { padding:22px 18px; color:var(--muted); font-size:13px; line-height:1.5; }
  footer { padding:12px 18px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; }
  footer button { padding:8px 16px; border-radius:8px; border:1px solid var(--line); background:none; color:inherit; font:inherit; cursor:pointer; }
</style>
</head>
<body>
<header><h1 id="title">Choose a printer</h1><p id="hint"></p></header>
<ul id="list"></ul>
<div class="empty" id="empty" hidden></div>
<footer><button id="cancel">Cancel</button></footer>
<script>
  const list = document.getElementById("list"), empty = document.getElementById("empty")
  chooser.onList(({ title, hint, emptyText, items }) => {
    document.getElementById("title").textContent = title
    document.getElementById("hint").textContent = hint || ""
    list.replaceChildren(...items.map((d) => {
      const li = document.createElement("li"), b = document.createElement("button")
      b.textContent = d.name
      if (d.detail) { const s = document.createElement("small"); s.textContent = d.detail; b.appendChild(s) }
      b.onclick = () => chooser.pick(d.id)
      li.appendChild(b)
      return li
    }))
    empty.hidden = items.length > 0
    empty.textContent = emptyText || ""
  })
  document.getElementById("cancel").onclick = () => chooser.cancel()
  addEventListener("keydown", (e) => { if (e.key === "Escape") chooser.cancel() })
</script>
</body>
</html>
